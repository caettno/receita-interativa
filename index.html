<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Receita Interativa</title>
</head>
<body>
  <header>
    <h1> Pão de Queijo Mineiro Tradicional </h1>

    <p>
      Uma receita tradicional de Minas Gerais:
      crocante por fora e macio por dentro. 
    </p>

    <img
    src="https://placehold.co/400x200"
    alt="Pães de queijo"
    >
  </header>
  
  <section>

    <h2>Ingredientes</h2>

 

    <ul>

        <li>500 g de polvilho azedo</li>

        <li>1 copo de leite</li>

        <li>1/2 copo de óleo</li>

        <li>2 ovos</li>

        <li>300 g de queijo Minas curado ralado</li>

        <li>Sal a gosto</li>

    </ul>

 

    <label for="acompanhamento">

        Escolha um acompanhamento:

    </label>

 

    <input

        id="acompanhamento"

        list="bebidas"

        placeholder="Digite sua preferência"

    >

 

    <datalist id="bebidas">

        <option value="Café">

        <option value="Guaraná">

        <option value="Doce de leite">

    </datalist>

</section>
</body>
</html>
